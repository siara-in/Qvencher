---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Private Data Lake Qvencher</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}"/>
</head>
<body>

  <header class="top-bar">
    <div class="brand">
      <img src="{{ '/app_icon.png' | relative_url }}" alt="Qvencher App Icon" class="app-icon"/>
      <span class="brand-name">Private Data Lake Qvencher</span>
    </div>

    <nav class="nav-links">
      <a href="{{ '/EULA.html' | relative_url }}">EULA</a>
      <a href="{{ '/privacy.html' | relative_url }}">Privacy</a>
      <div class="docs-dropdown">
      <a href="{{ '/latest/features.html' | relative_url }}" id="docsLink" class="docs-link">
        Features
      </a>
      <select class="version-select" id="versionSelect">
          <option value="latest" selected>latest</option>
          <option value="latest">v1.0</option>
      </select>
      </div>
    </nav>
  </header>

  <br/>
  <h1>{{ page.title }}</h1>

  {{ content }}

  <br/>
  <footer class="footer">
    <div class="footer-content">
      <span>
        © <span id="year"></span> <strong>Arundale Ramanathan</strong> · Siara Logics (India)
      </span>
      <img src="{{ '/siara-in.png' | relative_url }}" alt="Siara Logics Logo" class="company-logo"/>
    </div>
  </footer>

  <script>
    const versionSelect = document.getElementById("versionSelect");
    const docsLink = document.getElementById("docsLink");
    document.getElementById("year").textContent = new Date().getFullYear();
    function updateDocsLink() {
        const version = versionSelect.value;
        var rootPath = "{{ '/' | relative_url }}"
        docsLink.href = rootPath + version + "/features.html";
    }

    versionSelect.addEventListener("change", () => {
      var rootPath = "{{ '/' | relative_url }}"
      window.location.href = rootPath + versionSelect.value + "/features.html";
    });
    </script>

</body>
</html>
